services:
  azurite:
    image: ${DOCKERHUB_USERNAME:-ghee9ine}/coffeenchill-azurite:${IMAGE_TAG:-v2.0}
    pull_policy: always
    container_name: coffeenchill-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - coffeenchill-net
    healthcheck:
      # The image's BusyBox `nc` doesn't reliably support -z against this
      # service (confirmed by hand: it reports the port closed even while
      # Azurite's own logs show it listening) - a plain Node TCP connect
      # is used instead, since Node is guaranteed present in this image.
      test: ["CMD", "node", "-e", "require('net').connect(10000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  functions:
    # No "build:" here on purpose: the compose stack must come from the
    # published Docker Hub images by default. pull_policy: always makes
    # `docker compose up` always check Docker Hub for ${IMAGE_TAG:-v2.0}
    # rather than silently reusing a stale local image of the same tag.
    image: ${DOCKERHUB_USERNAME:-ghee9ine}/coffeenchill-functions:${IMAGE_TAG:-v2.0}
    pull_policy: always
    container_name: coffeenchill-functions
    depends_on:
      azurite:
        condition: service_healthy
    ports:
      - "7071:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      DocumentStorageMode: Blob
      OrderStatusStepDelaySeconds: "3"
      # Inside the container, UseDevelopmentStorage=true would resolve to
      # this same container rather than the separate azurite service, so
      # the connection string spells out the azurite service hostname for
      # all three endpoints instead.
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
    networks:
      - coffeenchill-net
    restart: unless-stopped

networks:
  coffeenchill-net:
    driver: bridge

volumes:
  azurite-data:
